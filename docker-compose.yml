services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18+ images store data in a version subdir and expect the mount at
      # /var/lib/postgresql (NOT /data) — see docker-library/postgres#1259.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pmo-backend
    restart: unless-stopped
    # Loads JWT/OAuth/LDAP secrets etc. from the existing local pmo-backend/.env.
    # The DATABASE_* values below override that file so the backend talks to the
    # "postgres" service instead of localhost.
    env_file:
      - .backend.env
    environment:
      # Force production in the container — overrides NODE_ENV=development from the
      # dev .env (env_file). Dev mode would select TsMorphMetadataProvider, which
      # reads ./src/*.entity.ts (absent from the compiled image) and crashes startup.
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_HOST: postgres
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-pmo_dashboard}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SEED_PMOADMIN_PASSWORD: ${SEED_PMOADMIN_PASSWORD:?SEED_PMOADMIN_PASSWORD must be set in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env}
      PORT: 3000

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-pmo-uploads}
      STORAGE_DRIVER: minio
      OAUTH_ALLOWED_DOMAIN: ${OAUTH_ALLOWED_DOMAIN:-carsu.edu.ph,csucc.edu.ph}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./pmo-frontend
    restart: unless-stopped
    env_file:
      - .frontend.env
    environment:
      # Browser-facing API URL — must be reachable from the user's browser
      # (the app is an SPA, so requests are made client-side, not container-to-container).
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-NUXT_PUBLIC_API_BASE must be set in .env}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
  minio:
    image: 'quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z'
    restart: unless-stopped
    command:
      - server
      - /data
      - '--console-address'
      - ':9001'
    environment:
      MINIO_ROOT_USER: '${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}'
      MINIO_ROOT_PASSWORD: '${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}'
    ports:
      - '${MINIO_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - 'minio_data:/data'
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: 'quay.io/minio/mc:latest'
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}'
      MINIO_BUCKET_NAME: '${MINIO_BUCKET_NAME:-pmo-uploads}'
    entrypoint:
      - /bin/sh
      - '-c'
    command:
      - |
        set -e
        mc alias set pmo "http://minio:9000" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "pmo/$$MINIO_BUCKET_NAME"
        mc anonymous set none "pmo/$$MINIO_BUCKET_NAME"
        echo "MINIO_INIT_OK: bucket=$$MINIO_BUCKET_NAME visibility=private"

volumes:
  pgdata:
  backend_uploads:
  minio_data: