# Standalone dev stack — hot reload for backend + frontend.
# Independent from docker-compose.yml (not an override): run one or the other.
#
#   Switch to dev:  docker compose down && docker compose -f docker-compose.dev.yml up -d --build
#   Switch to prod: docker compose -f docker-compose.dev.yml down && docker compose up -d --build
#
# Same project directory -> same volume names (pgdata, backend_uploads) in both
# files, so postgres data/uploads persist across switches.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pmo-backend
    restart: unless-stopped
    env_file:
      - ./pmo-backend/.env
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_NAME: ${POSTGRES_DB:-pmo_dashboard}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SEED_PMOADMIN_PASSWORD: ${SEED_PMOADMIN_PASSWORD:?SEED_PMOADMIN_PASSWORD must be set in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set in .env}
      PORT: 3000
      # MINIO-0: object-storage connection, injected from the ROOT .env — same
      # single-source-of-truth rule as DATABASE_PASSWORD above. These must match
      # the minio service's root credentials exactly; if the backend read its own
      # copy from pmo-backend/.env the two could drift and you would only find out
      # at runtime as SignatureDoesNotMatch. `environment:` overrides `env_file:`,
      # so a stale MINIO_* left in pmo-backend/.env cannot win here.
      #
      # STORAGE_DRIVER is deliberately NOT set here — it stays in pmo-backend/.env
      # so each developer can flip local <-> minio without editing compose.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-pmo-uploads}
    command: ["npm", "run", "start:dev"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./pmo-backend:/app
      - /app/node_modules
      - /app/dist
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./pmo-frontend
      target: build
    restart: unless-stopped
    env_file:
      - ./pmo-frontend/.env
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:${BACKEND_PORT:-3000}
      NODE_ENV: development
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3001
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    volumes:
      - ./pmo-frontend:/app
      - /app/node_modules

  # MINIO-0 — S3-compatible object storage for uploads.
  # Step 0 of the storage migration: INFRA ONLY. The backend still runs
  # STORAGE_DRIVER=local and has no depends_on for minio, so nothing here sits on
  # the request path yet — starting this stack cannot break the existing dev flow.
  # The backend dependency gets added at cutover, once MinioStorageDriver exists.
  #
  # Pinned to the last community release that still ships the full web console
  # (browse/upload/inspect objects at http://localhost:9001). Releases from
  # 2025-05-24 onward reduce the console to a login-only page, which makes
  # eyeballing objects while building the driver much harder.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # The server's root credentials ARE the backend's client credentials: one
      # pair of values in the root .env feeds both, so they cannot drift.
      # MinIO refuses to start if user < 3 chars or password < 8 chars.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    ports:
      # LEFT side is HOST-only. Do NOT wire MINIO_PORT here: the backend reads
      # MINIO_PORT to reach minio:9000 across the compose network, so it must stay
      # 9000. Same host-vs-container split as openldap's "1389:389" below.
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot: create the bucket, force it PRIVATE, exit. Re-running is a no-op.
  # Private is a hard requirement, not a default — main.ts gates /uploads to image
  # types only and serves documents exclusively through the JWT-guarded download
  # endpoint. An anonymous-readable bucket would hand out every stored document.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-pmo-uploads}
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation so the SHELL expands these, not compose —
    # keeps the secrets out of the rendered `docker compose config` output.
    command:
      - |
        set -e
        mc alias set pmo "http://minio:9000" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "pmo/$$MINIO_BUCKET_NAME"
        mc anonymous set none "pmo/$$MINIO_BUCKET_NAME"
        echo "MINIO_INIT_OK: bucket=$$MINIO_BUCKET_NAME visibility=private"

  # T5a — Self-hosted LDAP test directory (proves auth before MIS cutover)
  # NOT started by default. Start explicitly with:
  #   docker compose --profile ldap-test up -d
  # Then add LDAP_* vars to pmo-backend/.env and run:
  #   docker compose up -d backend   (recreates backend with LDAP env active)
  # See handover/ldap-test/MIS_SWAP.md for the full procedure and MIS swap guide.
  openldap:
    profiles: [ "ldap-test" ]
    image: osixia/openldap:1.5.0
    command: [ "--copy-service" ]
    environment:
      LDAP_ORGANISATION: CSU CORE
      LDAP_DOMAIN: carsu.edu.ph
      LDAP_ADMIN_PASSWORD: testldapadmin
      LDAP_TLS: "false"
    volumes:
      # SYS-AUDIT-02 (HA-1): path updated after ldap-test/ moved under handover/.
      - ./handover/ldap-test/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    ports:
      - "1389:389"

volumes:
  pgdata:
  backend_uploads:
  # MINIO-0: dev-only for now — docker-compose.yml has no minio service yet, so
  # objects written here do NOT follow a switch to the prod stack. Add the same
  # service + volume there before the driver cutover.
  minio_data:
